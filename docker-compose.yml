version: '3.8'

services:
  nat-ai:
    build: .
    container_name: nat-ai-assistant
    ports:
      - "8000:8000"
    environment:
      - GROQ_API_KEY=${GROQ_API_KEY}
      - GROQ_API_KEY_2=${GROQ_API_KEY_2}
      - GROQ_API_KEY_3=${GROQ_API_KEY_3}
      - GROQ_MODEL=${GROQ_MODEL:-llama-3.3-70b-versatile}
      - TAVILY_API_KEY=${TAVILY_API_KEY}
      - ALPHA_VANTAGE_KEY=${ALPHA_VANTAGE_KEY}
      - FMP_KEY=${FMP_KEY}
      - NEWS_API_KEY=${NEWS_API_KEY}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - GOOGLE_CSE_ID=${GOOGLE_CSE_ID}
      - SERPAPI_KEY=${SERPAPI_KEY}
      - TTS_VOICE=${TTS_VOICE:-en-US-AriaNeural}
      - TTS_RATE=${TTS_RATE:-+0%}
      - ASSISTANT_NAME=${ASSISTANT_NAME:-Natasha}
      - JARVIS_USER_TITLE=${JARVIS_USER_TITLE:-Boss}
    volumes:
      - ./database:/app/database
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
